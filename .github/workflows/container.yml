name: Publish coordinated container
on:
  workflow_dispatch:
    inputs:
      version:
        description: Container version, major.minor.patch
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: coordinated-container-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: ./.github/actions/components
        with:
          server-key: ${{ secrets.HAUNT_SERVER_READ_KEY }}
          client-key: ${{ secrets.HAUNT_CLIENT_READ_KEY }}
          plugin-key: ${{ secrets.HAUNT_PLUGIN_READ_KEY }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: haunt:check
          labels: |
            org.opencontainers.image.source=https://github.com/example-git/haunt
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: HAUNT_VERSION=${{ inputs.version }}
          cache-from: type=gha,scope=master-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=master-${{ matrix.arch }}
      - run: python3 scripts/test-container.py haunt:check
        working-directory: server
      - name: Publish tested architecture
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
          REVISION: ${{ github.sha }}
        run: |
          tag="ghcr.io/example-git/haunt:$VERSION-$ARCH-${REVISION:0:12}"
          docker tag haunt:check "$tag"
          docker push "$tag"
  manifest:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish multi-architecture tag
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          docker buildx imagetools create --tag "ghcr.io/example-git/haunt:$VERSION" \
            "ghcr.io/example-git/haunt:$VERSION-amd64-${REVISION:0:12}" \
            "ghcr.io/example-git/haunt:$VERSION-arm64-${REVISION:0:12}"
