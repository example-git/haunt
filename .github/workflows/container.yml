name: Verify coordinated container
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (defaults to the pinned client version)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    outputs:
      version: ${{ steps.release.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: components
        uses: ./.github/actions/components
      - name: Read hosted client origin
        id: hosted_client
        run: |
          origin=$(python3 -c 'import json,re; value=json.load(open("client/web-deployment.json")); assert value["version"] == 1; origin=value["origin"]; assert re.fullmatch(r"https://[a-z0-9][a-z0-9.-]*", origin); print(origin)')
          echo "HAUNT_WEB_CLIENT_ORIGIN=$origin" >> "$GITHUB_ENV"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
      - id: release
        name: Select image version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            version="$REQUESTED_VERSION"
          elif [[ "$RELEASE_REF" =~ ^v[0-9] ]]; then
            version="${RELEASE_REF#v}"
          else
            version=$(node -p 'require("./client/package.json").version')
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Image version must be major.minor.patch' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Validate startup scripts
        run: shellcheck server/deploy/container/*.sh
      - uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: haunt:check
          build-args: |
            HAUNT_VERSION=${{ steps.release.outputs.version }}
            HAUNT_WEB_CLIENT_ORIGIN=${{ steps.hosted_client.outputs.origin }}
          labels: |
            org.opencontainers.image.source=https://github.com/example-git/haunt
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            vg.xo.haunt.server-revision=${{ steps.components.outputs.server }}
            vg.xo.haunt.client-revision=${{ steps.components.outputs.client }}
          cache-from: type=gha,scope=coordinated-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=coordinated-${{ matrix.arch }}
      - run: python scripts/test-container.py haunt:check
        working-directory: server
      - name: Export image
        run: |
          mkdir -p release
          docker save haunt:check | gzip > release/haunt-linux-${{ matrix.arch }}.docker.tar.gz
          cd release
          sha256sum -- *.docker.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: haunt-container-linux-${{ matrix.arch }}
          path: release/*
