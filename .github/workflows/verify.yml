name: Verify coordinated source
"on":
  workflow_call: {}
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/components
        id: components
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test -- --reporter=default --reporter=json --outputFile=test-results/unit.json
      - run: npm run test:version
      - run: npm run test:browser-harness
      - run: npm run test:chat-stability
      - run: npm run test:message-scroll
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-regression-evidence-${{ github.run_attempt }}
          path: client/test-results/
          retention-days: 14
    defaults:
      run:
        shell: bash
        working-directory: client
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: server
    env:
      HAUNT_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:32768/chatxo_check?sslmode=disable
      HAUNT_SYNC_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:32768/haunt_sync_iteration?sslmode=disable
      HAUNT_SYNC_E2E: "1"
      HAUNT_CLIENT_DIR: ${{ github.workspace }}/server/client
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/components
        id: components
      - run: ln -s "$GITHUB_WORKSPACE/sync" server/sync
        name: Attach pinned sync fixture
        working-directory: .
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/client/package-lock.json
      - name: Read hosted client origin
        id: hosted_client
        run:
          'origin=$(python3 -c ''import json,re; value=json.load(open("client/web-deployment.json")); assert value["version"]
          == 1; origin=value["origin"]; assert re.fullmatch(r"https://[a-z0-9][a-z0-9.-]*", origin); print(origin)'')

          echo "HAUNT_WEB_CLIENT_ORIGIN=$origin" >> "$GITHUB_ENV"

          echo "origin=$origin" >> "$GITHUB_OUTPUT"

          '
      - name: Use official Ubuntu package servers
        working-directory: .
        run: sudo python3 scripts/configure-linux-packages.py
      - name: Require media dependencies
        run: "sudo apt-get update

          sudo apt-get install -y --no-install-recommends ffmpeg postgresql-client-16

          test -x /usr/bin/google-chrome

          ffmpeg -version

          ffprobe -version

          "
      - name: Start isolated PostgreSQL
        run:
          "docker run -d --name chatxo-identity-check -p 127.0.0.1:32768:5432 \\\n  -e POSTGRES_HOST_AUTH_METHOD=trust\
          \ -e POSTGRES_DB=chatxo_check \\\n  postgres:16-alpine > \"$RUNNER_TEMP/haunt-regression-container\"\ntest\
          \ \"$(docker inspect chatxo-identity-check --format '{{.Config.Image}}')\" = postgres:16-alpine\ntest \"\
          $(docker port chatxo-identity-check 5432/tcp)\" = 127.0.0.1:32768\nfor _ in $(seq 1 60); do\n  if docker\
          \ exec chatxo-identity-check pg_isready -h 127.0.0.1 -U postgres -d chatxo_check; then\n    docker exec\
          \ chatxo-identity-check createdb -h 127.0.0.1 -U postgres haunt_sync_iteration\n    exit 0\n  fi\n  sleep\
          \ 1\ndone\nexit 1\n"
      - run: npm ci
        working-directory: server/client
      - run: npm test && npm run test:version && npm run test:browser-harness && npm run build
        working-directory: server/client
      - name: Check server contracts and tooling
        run: "go mod verify

          go vet ./...

          go run ./cmd/apidocs -check -client-out client/static/api

          python3 -m unittest discover -s scripts/tests

          "
      - name: Run database, media and recovery regressions with race detection
        run: 'mkdir -p test-results

          go test -race -ldflags="-X github.com/example-git/haunt-server/internal/config.HostedClientOrigin=$HAUNT_WEB_CLIENT_ORIGIN"
          -p 2 -count=1 -timeout=8m -json ./... | tee test-results/server.jsonl

          python scripts/check-test-results.py test-results/server.jsonl

          '
      - name: Check million-message history and mixed workload capacity
        env:
          HAUNT_SCALE_TEST: "1"
          HAUNT_SCALE_LATEST: "1"
          HAUNT_SCALE_CLIENT_DIR: ${{ github.workspace }}/server/client
          HAUNT_SCALE_REPORT: ${{ github.workspace }}/server/test-results/history-scale.json
        run: go test -race ./internal/httpapi -run '^TestHistoryScale$' -count=1 -timeout=15m -v
      - name: Check live social provider metadata and media
        env:
          HAUNT_LIVE_EMBEDS: "1"
        run: go test -race ./internal/embeds -run '^TestLiveSocialProviders$' -count=1 -timeout=90s -v
      - name: Check real browser workflows
        working-directory: server/client
        run: npm run test:browser
      - name: Build embedded server for both Linux targets
        run:
          "mkdir -p bin\nfor arch in amd64 arm64; do\n  CGO_ENABLED=0 GOOS=linux GOARCH=\"$arch\" go build -tags\
          \ webclient -trimpath -ldflags=\"-X github.com/example-git/haunt-server/internal/config.HostedClientOrigin=$HAUNT_WEB_CLIENT_ORIGIN\"\
          \ -o \"bin/haunt-server-linux-$arch\" ./cmd/haunt\ndone\n"
      - name: Check standalone first-run setup
        run:
          "docker exec chatxo-identity-check createdb -U postgres haunt_wizard_test_ci\nHAUNT_WIZARD_TEST_DATABASE_URL='postgres://postgres@127.0.0.1:32768/haunt_wizard_test_ci?sslmode=disable'\
          \ \\\n  HAUNT_WIZARD_TEST_BINARY=\"$PWD/bin/haunt-server-linux-amd64\" \\\n  go test -race ./cmd/haunt -run\
          \ '^TestFirstRunBinary$' -count=1 -v\n"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-regression-evidence-${{ github.run_attempt }}
          path: "server/test-results/

            server/client/test-results/"
          retention-days: 14
      - name: Remove only this job's database container
        if: always()
        run:
          "if [ -s \"$RUNNER_TEMP/haunt-regression-container\" ]; then\n  docker rm -f -v \"$(cat \"$RUNNER_TEMP/haunt-regression-container\"\
          )\"\nfi\n"
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/components
      - name: Read hosted client origin
        run:
          'origin=$(python3 -c ''import json,re; value=json.load(open("client/web-deployment.json")); assert value["version"]
          == 1; origin=value["origin"]; assert re.fullmatch(r"https://[a-z0-9][a-z0-9.-]*", origin); print(origin)'')

          echo "HAUNT_WEB_CLIENT_ORIGIN=$origin" >> "$GITHUB_ENV"

          '
      - uses: actions/setup-go@v6
        with:
          go-version-file: sync/go.mod
          cache-dependency-path: sync/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - name: Start isolated protocol database
        run:
          "docker run -d --name chatxo-identity-check -p 127.0.0.1:32768:5432 \\\n  -e POSTGRES_DB=haunt_sync_iteration\
          \ -e POSTGRES_USER=haunt_sync_iteration \\\n  -e POSTGRES_PASSWORD=synthetic-ci-fixture postgres:16-alpine\
          \ > \"$RUNNER_TEMP/haunt-sync-container\"\ntest \"$(docker inspect chatxo-identity-check --format '{{.Config.Image}}')\"\
          \ = postgres:16-alpine\ntest \"$(docker port chatxo-identity-check 5432/tcp)\" = 127.0.0.1:32768\nfor _\
          \ in $(seq 1 60); do\n  if docker exec chatxo-identity-check pg_isready -U haunt_sync_iteration -d haunt_sync_iteration;\
          \ then exit 0; fi\n  sleep 1\ndone\nexit 1\n"
      - name: Exercise real protocol, secret changes, browser crypto and SMTP
        working-directory: sync
        env:
          HAUNT_SYNC_TEST_DATABASE_URL: postgres://haunt_sync_iteration:synthetic-ci-fixture@127.0.0.1:32768/haunt_sync_iteration?sslmode=disable
          HAUNT_SYNC_CLIENT_CHECKOUT: ${{ github.workspace }}/client
        run:
          go test -race -ldflags="-X github.com/example-git/haunt-sync/internal/service.HostedClientOrigin=$HAUNT_WEB_CLIENT_ORIGIN"
          ./... -count=1 -timeout=8m -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-regression-evidence-${{ github.run_attempt }}
          path: client/test-results/
          if-no-files-found: ignore
      - name: Remove only this job's fixture
        if: always()
        run:
          "if [ -s \"$RUNNER_TEMP/haunt-sync-container\" ]; then\n  docker rm -f -v \"$(cat \"$RUNNER_TEMP/haunt-sync-container\"\
          )\"\nfi\n"
