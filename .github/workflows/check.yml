name: Coordinated source pins
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/components
        with:
          server-key: ${{ secrets.HAUNT_SERVER_READ_KEY }}
          client-key: ${{ secrets.HAUNT_CLIENT_READ_KEY }}
          plugin-key: ${{ secrets.HAUNT_PLUGIN_READ_KEY }}
      - run: python3 scripts/sync-docs.py --check
