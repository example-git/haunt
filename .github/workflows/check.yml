name: Coordinated source pins
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/components
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check release coordination and failure paths
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - name: Validate workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - run: python scripts/sync-docs.py --check
      - run: python scripts/check-docs.py
