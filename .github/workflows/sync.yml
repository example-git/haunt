name: Verify optional sync images
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (defaults to pinned client version)
        type: string
        required: false
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/components
        id: components
      - name: Validate single-container tunnel deployment configuration
        env:
          HAUNT_SYNC_HOST: nexus.example.test
          HAUNT_SYNC_DB_PASSWORD: synthetic-compose-check
        run: |
          docker compose -f sync/compose.yml config --quiet
      - name: Read hosted client origin
        run: |
          origin=$(python3 -c 'import json,re; value=json.load(open("client/web-deployment.json")); assert value["version"] == 1; origin=value["origin"]; assert re.fullmatch(r"https://[a-z0-9][a-z0-9.-]*", origin); print(origin)')
          echo "HAUNT_WEB_CLIENT_ORIGIN=$origin" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version-file: sync/go.mod
          cache-dependency-path: sync/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - name: Start isolated database fixture
        run: |
          docker run -d --name chatxo-identity-check -p 127.0.0.1:32768:5432 -e POSTGRES_DB=haunt_sync_iteration -e POSTGRES_USER=haunt_sync_iteration -e POSTGRES_PASSWORD=synthetic-ci-fixture postgres:16-alpine
          for _ in $(seq 1 40); do
            if docker exec chatxo-identity-check pg_isready -h 127.0.0.1 -U haunt_sync_iteration -d haunt_sync_iteration; then break; fi
            sleep 1
          done
          test "$(docker inspect chatxo-identity-check --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostIp}}')" = 127.0.0.1
          test "$(docker inspect chatxo-identity-check --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}')" = 32768
      - name: Real Go and browser protocol and SMTP checks
        working-directory: sync
        env:
          HAUNT_SYNC_TEST_DATABASE_URL: postgres://haunt_sync_iteration:synthetic-ci-fixture@127.0.0.1:32768/haunt_sync_iteration?sslmode=disable
          HAUNT_SYNC_CLIENT_CHECKOUT: ${{ github.workspace }}/client
        run: go test -race -ldflags="-X github.com/example-git/haunt-sync/internal/service.HostedClientOrigin=$HAUNT_WEB_CLIENT_ORIGIN" ./... -count=1 -timeout 8m
  build:
    outputs:
      version: ${{ steps.version.outputs.value }}
      sync: ${{ steps.components.outputs.sync }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/components
        id: components
      - uses: actions/setup-go@v6
        with:
          go-version-file: sync/go.mod
          cache-dependency-path: sync/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - name: Read hosted client origin
        id: hosted_client
        run: |
          origin=$(python3 -c 'import json,re; value=json.load(open("client/web-deployment.json")); assert value["version"] == 1; origin=value["origin"]; assert re.fullmatch(r"https://[a-z0-9][a-z0-9.-]*", origin); print(origin)')
          echo "HAUNT_WEB_CLIENT_ORIGIN=$origin" >> "$GITHUB_ENV"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
      - id: version
        env:
          REQUESTED: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          version="$REQUESTED"
          if [ -z "$version" ]; then
            if [[ "$RELEASE_REF" =~ ^v[0-9] ]]; then version="${RELEASE_REF#v}"; else version=$(node -p 'require("./client/package.json").version'); fi
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build standalone native binary
        working-directory: sync
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p ../release
          CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath -ldflags="-s -w -X main.version=$VERSION -X github.com/example-git/haunt-sync/internal/service.HostedClientOrigin=$HAUNT_WEB_CLIENT_ORIGIN" -o "../release/haunt-sync-linux-$ARCH" ./cmd/haunt-sync
          "../release/haunt-sync-linux-$ARCH" --version
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: sync
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: haunt-sync:check
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            HAUNT_WEB_CLIENT_ORIGIN=${{ steps.hosted_client.outputs.origin }}
          labels: |
            org.opencontainers.image.source=https://github.com/example-git/haunt-sync
            org.opencontainers.image.revision=${{ steps.components.outputs.sync }}
            vg.xo.haunt.hub-revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=sync-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sync-${{ matrix.arch }}
      - name: Start isolated database fixture
        run: |
          docker run -d --name chatxo-identity-check -p 127.0.0.1:32768:5432 -e POSTGRES_DB=haunt_sync_iteration -e POSTGRES_USER=haunt_sync_iteration -e POSTGRES_PASSWORD=synthetic-ci-fixture postgres:16-alpine
          for _ in $(seq 1 40); do
            if docker exec chatxo-identity-check pg_isready -h 127.0.0.1 -U haunt_sync_iteration -d haunt_sync_iteration; then break; fi
            sleep 1
          done
      - name: Verify standalone TLS binary path and encrypted restart restore
        env:
          HAUNT_SYNC_TEST_DATABASE_URL: postgres://haunt_sync_iteration:synthetic-ci-fixture@127.0.0.1:32768/haunt_sync_iteration?sslmode=disable
        run: python scripts/test-sync-container.py haunt-sync:check --client client
      - name: Verify encrypted sync and disposable tunnel restart
        run: python scripts/test-sync-bundle.py haunt-sync:check --client client
      - name: Export tested image and binaries
        run: |
          docker save haunt-sync:check | gzip > release/haunt-sync-linux-${{ matrix.arch }}.docker.tar.gz
          cd release
          sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: haunt-sync-linux-${{ matrix.arch }}
          path: release/*
